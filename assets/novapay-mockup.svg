  <rect x="462" y="158" width="42" height="14" rx="5" fill="#93c5fd"/>

  <!-- chart -->
  <rect x="168" y="208" width="408" height="102" rx="10" fill="#111c33"/>
  <path d="M182 290 L232 268 L282 278 L332 244 L382 254 L432 222 L482 232 L532 206 L560 214 L560 296 L182 296 Z" fill="url(#area)"/>
  <path d="M182 290 L232 268 L282 278 L332 244 L382 254 L432 222 L482 232 L532 206 L560 214" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="432" cy="222" r="4.5" fill="#a5b4fc"/>
  <rect x="182" y="300" width="34" height="5" rx="2.5" fill="#334155"/>
  <rect x="236" y="300" width="34" height="5" rx="2.5" fill="#334155"/>
